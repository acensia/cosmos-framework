# BEHAVIOR-1K action-policy SFT run config for the `action_policy_behavior1k_edge_state`
# experiment (robot-state-conditioned initial action row). Single-task fine-tune sizing: FSDP 4x1 (one 4-GPU node), global
# batch 32 x 4 x grad_accum 4 = 512.
# Env: BEHAVIOR1K_ROOT, EDGE_HF_PATH, BASE_CHECKPOINT_PATH, WAN_VAE_PATH,
# IMAGINAIRE_OUTPUT_ROOT.

[job]
task         = "vfm"
experiment   = "action_policy_behavior1k_edge_state"
project      = "cosmos3_action_behavior1k"
group        = "action_sft"
name         = "action_policy_behavior1k_edge_state"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 4
data_parallel_replicate_degree = 1    # single 4-GPU node

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [16000]
warm_up_steps = [250]

[trainer]
max_iter        = 2000
logging_iter    = 50
grad_accum_iter = 4       # global batch = max_samples 32 x (shard 4 x replicate 1) x 4 = 512

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
