# 2-GPU variant of action_policy_behavior1k_edge: FSDP 2x1, grad_accum 8 keeps
# the same global batch (32 x 2 x 8 = 512) and therefore the same LR schedule
# semantics as the 4-GPU recipe — only wall-clock differs (~2x slower).
# Launch with NPROC_PER_NODE=2.
# Env: BEHAVIOR1K_ROOT, EDGE_HF_PATH, BASE_CHECKPOINT_PATH, WAN_VAE_PATH,
# IMAGINAIRE_OUTPUT_ROOT.

[job]
task         = "vfm"
experiment   = "action_policy_behavior1k_edge_state"
project      = "cosmos3_action_behavior1k"
group        = "action_sft"
name         = "action_policy_behavior1k_edge_state_2gpu"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 2
data_parallel_replicate_degree = 1    # 2 GPUs on one node

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [16000]
warm_up_steps = [250]

[trainer]
max_iter        = 2000
logging_iter    = 50
grad_accum_iter = 8       # global batch = max_samples 32 x (shard 2 x replicate 1) x 8 = 512

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
